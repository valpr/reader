name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/ui/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.4.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: SvelteKit sync
        run: pnpm svelte-kit sync
        working-directory: apps/web

      - name: Build docs
        run: pnpm docs:build
        env:
          DOCS_BASE_PATH: '/reader/docs/'

      - name: Copy docs into web static
        run: cp -r apps/docs/.vitepress/dist apps/web/static/docs

      - name: Build
        run: pnpm build
        working-directory: apps/web
        env:
          BASE_PATH: '/reader'
          VITE_PAGE_PATH: '/reader'
          VITE_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          VITE_ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
